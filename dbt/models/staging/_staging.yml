version: 2

models:
  - name: stg_orders
    description: >
      1 row per order, renamed/cast from raw.orders. Canonicalizes column naming
      (orders_id -> order_id, customers_id -> customer_id, date_date -> order_date) and
      casts net_sales to NUMERIC for money-safe precision.
    columns:
      - name: order_id
        description: >
          Unique order identifier. Every order is expected to have at least one matching
          sales line (verified: true for 100% of orders in the current data) -- checked
          explicitly here rather than just assumed, so a future order with zero sales lines
          would be caught.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sales')
                field: order_id
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: net_sales
        description: Net sales amount for the order. Expected non-negative -- verified true
          for all current data, enforced going forward by the expression_is_true test below.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"

  - name: stg_sales
    description: >
      1 row per order/product line, renamed/cast from raw.sales. Canonicalizes column naming
      (products_id -> product_id, date_date -> order_date) and casts net_sales to NUMERIC.
    columns:
      - name: order_id
        description: >
          Order identifier this line belongs to. Not unique at this grain (multiple product
          lines per order). One known value (5361303) has no matching row in stg_orders; the
          relationships test below is set to warn rather than fail for this documented,
          single-row exception. A new orphan appearing would still be a warning worth
          investigating, not a silent failure.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
              config:
                severity: warn
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
      - name: product_id
        description: Identifier of the product sold on this line.
        data_tests:
          - not_null
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: net_sales
        description: Net sales amount for this order/product line. Expected non-negative.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: qty
        description: Quantity of the product sold on this line. Expected non-negative.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
