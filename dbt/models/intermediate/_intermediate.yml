version: 2

models:
  - name: int_orders_products_agg
    description: "Sales lines rolled up to order grain: total product quantity per order."
    columns:
      - name: order_id
        description: Order identifier.
        data_tests:
          - unique
          - not_null
      - name: qty_product
        description: Total quantity of products in the order (SUM of qty across its sales lines).
        data_tests:
          - not_null

  - name: int_orders_enriched
    description: >
      One row per order (all history), enriched with qty_product and the order's segment
      based on the customer's order count in the trailing 12 months. Computed over full
      history so marts filtering to a specific year still see accurate prior-order counts
      reaching back before that year.
    columns:
      - name: order_id
        description: Order identifier.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Identifier of the customer who placed the order.
        data_tests:
          - not_null
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: net_sales
        description: Net sales amount for the order.
        data_tests:
          - not_null
      - name: qty_product
        description: Total quantity of products in the order.
        data_tests:
          - not_null
      - name: prior_orders_last_12mo
        description: >
          Count of the same customer's orders placed strictly within the 365 days before this
          order. Input to order_segment; exposed for auditability.
        data_tests:
          - not_null
      - name: order_segment
        description: >
          New (0 prior orders in the trailing 12 months, i.e. the customer's 1st order),
          Returning (1-3 prior orders, i.e. the 2nd-4th order), or VIP (4+ prior orders, i.e.
          the 5th+ order). See macros/segment_from_order_count.sql and the
          returning_order_threshold / vip_order_threshold vars in dbt_project.yml.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['New', 'Returning', 'VIP']
